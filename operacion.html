<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opción de tres operaciones básicas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<nav class="navbar"><div class="container"><a class="navbar-brand fw-bold" href="index.html">JS • Prácticas</a><a class="btn btn-sm btn-light" href="index.html">Página principal</a></div></nav>
<main class="container py-4">
 <div class="row justify-content-center"><div class="col-12 col-lg-8">
  <div class="card">
   <div class="card-header p-3">Ejercicio 15 • Condicional</div>
   <div class="card-body p-4">
    <h1 class="h3 mb-3">Opción de tres operaciones básicas</h1>
    <p class="text-secondary">Responde las ventanas que aparezcan para ejecutar el ejercicio.</p>
    
    <div id="resultado" class="resultado mt-3">El resultado aparecerá aquí después de responder las preguntas.</div>
    <div class="d-flex flex-wrap justify-content-between gap-2 mt-4"><a class="btn btn-outline-secondary" href="positivo.html">← Anterior</a><a class="btn btn-primary" href="index.html">⌂ Página principal</a><a class="btn btn-outline-secondary" href="operaciones.html">Siguiente →</a></div>
   </div>
  </div>
 </div></div>
</main>
<footer class="container text-center py-4">Ejercicio 15 de 25</footer>
<script>
function mostrar(contenido) {
 document.getElementById("resultado").innerHTML = contenido;
}
let eleccion = Number(prompt("Elige una operación:\n1. Suma\n2. Resta\n3. Multiplicación"));
let n1 = Number(prompt("Escribe el primer número"));
let n2 = Number(prompt("Escribe el segundo número"));
let resultado;
if (eleccion === 1) resultado = "La suma es: " + (n1 + n2);
else if (eleccion === 2) resultado = "La resta es: " + (n1 - n2);
else if (eleccion === 3) resultado = "La multiplicación es: " + (n1 * n2);
else resultado = "Opción no válida";
mostrar(resultado); alert(resultado);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
