<main class="container py-4">
 <div class="row justify-content-center"><div class="col-12 col-lg-8">

<footer class="container text-center py-4">Ejercicio 8 de 25</footer>
<script>
function mostrar(contenido) {
 document.getElementById("resultado").innerHTML = contenido;
}
let limite = Number(prompt("¿Hasta qué número deseas sumar los pares?"));
let i = 2, suma = 0;
do {
  if (i <= limite) suma += i;
  i += 2;
} while (i <= limite);
mostrar("La suma es: " + suma);
</script>
