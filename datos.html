<body>
<nav class="navbar"><div class="container"><a class="navbar-brand fw-bold" href="index.html">JS • Prácticas</a><a class="btn btn-sm btn-light" href="index.html">Página principal</a></div></nav>
<main class="container py-4">
 <div class="row justify-content-center"><div class="col-12 col-lg-8">
  <div class="card">
   <div class="card-header p-3">Ejercicio 24 • Datos</div>
   <div class="card-body p-4">
    <h1 class="h3 mb-3">Ejercicio de datos personales</h1>
    <p class="text-secondary">Responde las ventanas que aparezcan para ejecutar el ejercicio.</p>
    
    <div id="resultado" class="resultado mt-3">El resultado aparecerá aquí después de responder las preguntas.</div>
    <div class="d-flex flex-wrap justify-content-between gap-2 mt-4"><a class="btn btn-outline-secondary" href="preguntas.html">← Anterior</a><a class="btn btn-primary" href="index.html">⌂ Página principal</a><a class="btn btn-outline-secondary" href="javascript.html">Siguiente →</a></div>
   </div>
  </div>
 </div></div>
</main>
<footer class="container text-center py-4">Ejercicio 24 de 25</footer>
<script>
function mostrar(contenido) {
 document.getElementById("resultado").innerHTML = contenido;
}
let nombre = prompt("Escribe tu nombre");
let edad = Number(prompt("Escribe tu edad"));
let especialidad = prompt("Escribe tu especialidad");
let direccion = prompt("Escribe tu dirección");
mostrar(`Nombre: ${nombre}<br>Edad: ${edad}<br>Especialidad: ${especialidad}<br>Dirección: ${direccion}`);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
