 <div class="row justify-content-center"><div class="col-12 col-lg-8">

 </div></div>

<footer class="container text-center py-4">Ejercicio 16 de 25</footer>
<script>
function mostrar(contenido) {
 document.getElementById("resultado").innerHTML = contenido;
}
let n1 = Number(prompt("Ingresa el primer número"));
let n2 = Number(prompt("Ingresa el segundo número"));
let division = n2 !== 0 ? n1 / n2 : "No se puede dividir entre cero";
mostrar(`Suma: ${n1 + n2}<br>Resta: ${n1 - n2}<br>Multiplicación: ${n1 * n2}<br>División: ${division}`);
</script>
