 <div class="row justify-content-center"><div class="col-12 col-lg-8">

<footer class="container text-center py-4">Ejercicio 12 de 25</footer>
<script>
function mostrar(contenido) {
 document.getElementById("resultado").innerHTML = contenido;
}
let tabla = Number(prompt("¿Qué tabla de multiplicar deseas calcular?"));
let resultado = "";
for (let i = 1; i <= 10; i++) resultado += `${tabla} × ${i} = ${tabla * i}<br>`;
mostrar(resultado);
</script>
